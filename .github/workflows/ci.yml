# Build and test on every push and pull request to main.
# No third-party actions: the checkout is plain git, authenticated with the job's read-only token.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # macos-15: newest GA Apple Silicon runner image with a Swift 6 toolchain (Xcode 16.x),
    # which Package.swift (swift-tools-version 6.0, macOS 14 target) requires.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          # GITHUB_REF is refs/heads/main on push and refs/pull/N/merge on pull_request.
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch -q --no-tags --depth 1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD
          git log -1 --oneline
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        shell: bash
        run: set +e; swift test --no-parallel > test.log 2>&1; rc=$?; grep -nE "✘|recorded|Expectation|error:|Fatal" test.log | head -40; tail -n 3 test.log; exit $rc
